<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kas Tunai - Poltek KP Sorong</title>
<style>
  :root{
    --c-primary:#1565c0; --c-bg:#f4f6f9; --c-card:#fff; --c-line:#e2e6ec;
    --c-text:#1f2937; --c-muted:#6b7280; --c-ok:#16a34a; --c-warn:#ea580c;
    --c-err:#dc2626; --radius:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,Roboto,"Segoe UI",sans-serif;
    background:var(--c-bg);color:var(--c-text);font-size:15px;line-height:1.4}
  header{position:sticky;top:0;z-index:20;background:var(--c-primary);color:#fff;
    padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:17px;font-weight:600}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}

  .tabs{display:flex;background:var(--c-card);border-bottom:1px solid var(--c-line);
    position:sticky;top:54px;z-index:15}
  .tabs button{flex:1;border:0;background:none;padding:12px 6px;font-size:14px;
    color:var(--c-muted);font-weight:600;border-bottom:3px solid transparent}
  .tabs button.active{color:var(--c-primary);border-bottom-color:var(--c-primary)}

  .wrap{padding:12px;max-width:760px;margin:0 auto}

  .saldo-bar{display:flex;gap:10px;margin-bottom:12px}
  .saldo-bar .sb-item{flex:1;background:var(--c-card);border:1px solid var(--c-line);
    border-radius:var(--radius);padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .saldo-bar .sb-main{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
  .saldo-bar .sb-lbl{display:block;font-size:11px;color:var(--c-muted)}
  .saldo-bar .sb-main .sb-lbl{color:rgba(255,255,255,.85)}
  .saldo-bar .sb-val{display:block;font-size:18px;font-weight:700;margin-top:2px;white-space:nowrap}
  .saldo-bar .sb-val.neg{color:var(--c-err)}
  .saldo-bar .sb-main .sb-val.neg{color:#ffd1d1}

  .arah-bar{display:flex;gap:0;margin-bottom:10px;border:1px solid var(--c-line);
    border-radius:10px;overflow:hidden}
  .arah-bar button{flex:1;border:0;background:#fff;padding:10px;font-size:14px;font-weight:600;
    color:var(--c-muted);border-right:1px solid var(--c-line)}
  .arah-bar button:last-child{border-right:0}
  .arah-bar button.active{background:var(--c-primary);color:#fff}

  .sec-head{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 8px;
    font-size:13px;font-weight:700;color:var(--c-text);border-bottom:2px solid var(--c-line);
    padding-bottom:4px}
  .sec-head .debet{color:var(--c-ok)} .sec-head .kredit{color:var(--c-err)}

  .filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
  .filters button{flex:0 0 auto;border:1px solid var(--c-line);background:#fff;
    border-radius:20px;padding:7px 14px;font-size:13px;color:var(--c-text);font-weight:600}
  .filters button.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}

  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--c-muted);
    margin:2px 0 12px}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .dot{width:12px;height:12px;border-radius:3px;border:1px solid var(--c-line)}

  .card{background:var(--c-card);border:1px solid var(--c-line);border-radius:var(--radius);
    padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .status-spby{background:#fdf5ff} .status-lengkap{background:#f0faf4}
  .status-nota-ok{background:#f0f6ff} .status-foto-ok{background:#fffbf0}
  .status-belum{background:#fff}

  .card .row1{display:flex;justify-content:space-between;gap:8px}
  .card .keg{font-weight:600;font-size:15px}
  .card .tgl{font-size:12px;color:var(--c-muted)}
  .card .amt{font-weight:700;white-space:nowrap}
  .amt.kredit{color:var(--c-err)} .amt.debet{color:var(--c-ok)}
  .card .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:12px}
  .chip{background:#eef2f7;border-radius:20px;padding:3px 9px;color:var(--c-muted)}
  .chip.ok{background:#dcfce7;color:#166534} .chip.no{background:#fee2e2;color:#991b1b}
  .card .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .card .acts button{flex:1;min-width:90px;border:1px solid var(--c-line);background:#fff;
    border-radius:8px;padding:8px;font-size:13px;font-weight:600;color:var(--c-primary)}

  .fab{position:fixed;right:18px;bottom:20px;width:56px;height:56px;border-radius:50%;
    background:var(--c-primary);color:#fff;border:0;font-size:28px;z-index:30;
    box-shadow:0 4px 12px rgba(0,0,0,.25)}

  .empty{text-align:center;color:var(--c-muted);padding:40px 10px;font-size:14px}

  /* Rekap */
  .rekap-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rekap-grid .card{margin:0;text-align:center}
  .rekap-grid .lbl{font-size:12px;color:var(--c-muted)}
  .rekap-grid .val{font-size:18px;font-weight:700;margin-top:4px}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;
    align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:760px;border-radius:16px 16px 0 0;
    padding:16px;max-height:90vh;overflow:auto}
  .sheet h2{margin:0 0 12px;font-size:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--c-muted);margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--c-line);
    border-radius:8px;padding:10px;font-size:15px;font-family:inherit}
  .btn{width:100%;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;
    background:var(--c-primary);color:#fff;margin-top:4px}
  .btn.ghost{background:#eef2f7;color:var(--c-text)}
  .row2{display:flex;gap:10px} .row2>*{flex:1}

  /* Toast & loading */
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;
    padding:11px 18px;border-radius:24px;color:#fff;font-size:14px;font-weight:600;
    display:none;max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #toast.success{background:var(--c-ok)} #toast.error{background:var(--c-err)}
  #toast.info{background:#374151}
  #loading{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:70;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .spinner{width:38px;height:38px;border:4px solid #cdd5e0;border-top-color:var(--c-primary);
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading .msg{font-size:14px;color:var(--c-text);font-weight:600}
  .hidden{display:none!important}
</style>
</head>
<body>

<header>
  <h1>Kas Tunai</h1>
  <div class="sub">Politeknik KP Sorong &middot; <span id="userLabel"></span></div>
</header>

<div class="tabs">
  <button id="tabTransaksi" class="active" onclick="switchTab('transaksi')">Transaksi</button>
  <button id="tabLaporan" onclick="switchTab('laporan')">Laporan</button>
</div>

<!-- ================= TAB TRANSAKSI ================= -->
<div id="viewTransaksi" class="wrap">
  <div class="saldo-bar">
    <div class="sb-item"><span class="sb-lbl">Saldo Awal</span><span class="sb-val" id="sbAwal">-</span></div>
    <div class="sb-item sb-main"><span class="sb-lbl">Saldo Saat Ini</span><span class="sb-val" id="sbAkhir">-</span></div>
  </div>
  <div class="arah-bar" id="arahBar">
    <button data-a="semua" class="active">Semua</button>
    <button data-a="masuk">&#11015; Masuk</button>
    <button data-a="keluar">&#11014; Keluar</button>
  </div>
  <div class="filters" id="filterBar">
    <button data-f="all">Semua</button>
    <button data-f="belum">Belum SPJ</button>
    <button data-f="sudah">Sudah SPJ</button>
    <button data-f="belumlunas">Belum Lunas</button>
    <button data-f="belumfoto" class="active">Belum Foto</button>
    <button data-f="spby">SPBY</button>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#fdf5ff"></i>SPBY</span>
    <span><i class="dot" style="background:#f0faf4"></i>Lengkap</span>
    <span><i class="dot" style="background:#f0f6ff"></i>Nota OK</span>
    <span><i class="dot" style="background:#fffbf0"></i>Foto OK</span>
    <span><i class="dot" style="background:#fff"></i>Belum</span>
  </div>
  <div id="listTransaksi"></div>
</div>

<!-- ================= TAB LAPORAN ================= -->
<div id="viewLaporan" class="wrap hidden">
  <div class="rekap-grid" id="rekapGrid"></div>
  <button class="btn ghost" style="margin-top:14px" onclick="loadRekap()">Muat Ulang Rekap</button>
  <button class="btn" style="margin-top:8px" onclick="toast('Cetak SPJ/SSP PDF: lengkapi modul cetak','info')">
    Cetak Laporan SPJ / SSP
  </button>
</div>

<button class="fab" onclick="openModalTransaksi()">+</button>

<!-- ================= MODAL TRANSAKSI ================= -->
<div class="modal" id="modalTransaksi">
  <div class="sheet">
    <h2>Tambah Transaksi</h2>
    <div class="field"><label>Tanggal</label><input type="date" id="txTanggal"></div>
    <div class="field"><label>Kegiatan</label><input type="text" id="txKegiatan" placeholder="Nama kegiatan"></div>
    <div class="field"><label>Penanggung Jawab</label><input type="text" id="txPenjab"></div>
    <div class="row2">
      <div class="field"><label>Debet (masuk)</label><input type="number" id="txDebet" value="0"></div>
      <div class="field"><label>Kredit (keluar)</label><input type="number" id="txKredit" value="0"></div>
    </div>
    <div class="field"><label>Keterangan</label><textarea id="txKeterangan" rows="2"></textarea></div>
    <button class="btn" onclick="submitTransaksi()">Simpan</button>
    <button class="btn ghost" onclick="closeModal('modalTransaksi')">Batal</button>
  </div>
</div>

<!-- ================= MODAL NOTA ================= -->
<div class="modal" id="modalNota">
  <div class="sheet">
    <h2>Nota Transaksi <span id="notaTxLabel"></span></h2>
    <div id="notaList"></div>
    <hr>
    <h2 style="font-size:14px">Tambah Nota</h2>
    <div class="field"><label>Nama Penyedia</label><input type="text" id="ntPenyedia"></div>
    <div class="row2">
      <div class="field"><label>No Nota</label><input type="text" id="ntNoNota"></div>
      <div class="field"><label>Nilai</label><input type="number" id="ntNilai" value="0"></div>
    </div>
    <div class="field"><label>Tgl Nota</label><input type="date" id="ntTgl"></div>
    <div class="field"><label>Foto nota (opsional)</label><input type="file" id="ntFile" accept="image/*" capture="environment"></div>
    <button class="btn" onclick="submitNota()">Tambah Nota</button>
    <button class="btn ghost" onclick="closeModal('modalNota')">Tutup</button>
  </div>
</div>

<!-- ================= MODAL PENGEMBALIAN ================= -->
<div class="modal" id="modalKembali">
  <div class="sheet">
    <h2>Pengembalian <span id="kbTxLabel"></span></h2>
    <div id="kbList"></div>
    <hr>
    <div class="row2">
      <div class="field"><label>Tanggal</label><input type="date" id="kbTgl"></div>
      <div class="field"><label>Nilai</label><input type="number" id="kbNilai" value="0"></div>
    </div>
    <div class="field"><label>Keterangan</label><input type="text" id="kbKet"></div>
    <button class="btn" onclick="submitPengembalian()">Tambah</button>
    <button class="btn ghost" onclick="closeModal('modalKembali')">Tutup</button>
  </div>
</div>

<!-- ================= MODAL KALKULATOR PAJAK ================= -->
<div class="modal" id="modalPajak">
  <div class="sheet">
    <h2>&#9881; Hitung Pajak <span id="pjTxLabel"></span></h2>
    <div class="card status-belum" style="margin:0 0 12px">
      <div class="keg" id="pjKategori" style="font-size:14px"></div>
      <div class="tgl" id="pjNominal"></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px">
      <input type="checkbox" id="pjTermasukPPN" checked onchange="recalcPajak()"> Nilai sudah termasuk PPN
    </label>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px">
      <input type="checkbox" id="pjAdaNpwp" checked onchange="recalcPajak()"> Rekanan ber-NPWP
    </label>
    <div id="pjRincian" class="card" style="margin:0 0 12px"></div>
    <div class="row2">
      <button class="btn" onclick="cetakSSP('pph')">&#128424; SSP PPh</button>
      <button class="btn" onclick="cetakSSP('ppn')">&#128424; SSP PPN</button>
    </div>
    <button class="btn ghost" onclick="closeModal('modalPajak')">Tutup</button>
  </div>
</div>

<!-- ================= MODAL PENYEDIA (Kuitansi / SSP) ================= -->
<div class="modal" id="modalPenyedia">
  <div class="sheet">
    <h2>Data Penyedia / Rekanan</h2>
    <div class="field"><label>Nama Penyedia</label>
      <input type="text" id="pvNama" list="pvDatalist" oninput="onPenyediaInput()" autocomplete="off">
      <datalist id="pvDatalist"></datalist>
    </div>
    <div class="field"><label>NPWP (kosongkan bila tidak ber-NPWP)</label><input type="text" id="pvNpwp"></div>
    <div class="field"><label>Alamat</label><textarea id="pvAlamat" rows="2"></textarea></div>
    <button class="btn" onclick="simpanPenyediaLaluLanjut()">Simpan &amp; Lanjut</button>
    <button class="btn ghost" onclick="closeModal('modalPenyedia')">Batal</button>
  </div>
</div>

<div id="toast"></div>
<div id="loading"><div class="spinner"></div><div class="msg" id="loadingMsg">Memuat...</div></div>

];
var PAJAK_DEFAULT = { label:'Lain-lain (tanpa pajak otomatis)', kw:[], jenisPPh:'', tarifPPh:0, ppn:0,
  mapPPh:'', kjsPPh:'', minPPh:0, minPPN:0, catatan:'Tidak terklasifikasi - periksa manual' };

/** Cocokkan nama kegiatan ke salah satu kategori PAJAK_REF. */
function _klasifikasiPajak(kegiatan){
  var s=String(kegiatan||'').toLowerCase();
  for(var i=0;i<PAJAK_REF.length;i++){
    var kw=PAJAK_REF[i].kw;
    for(var j=0;j<kw.length;j++){ if(s.indexOf(kw[j])!==-1) return PAJAK_REF[i]; }
  }
  return PAJAK_DEFAULT;
}

/**
 * Hitung pajak bendahara untuk satu transaksi.
 * @param termasukPPN default true  -> DPP = nilai / 1,11 (bila kena PPN)
 * @param adaNpwp     default true  -> bila false, tarif PPh x2
 */
function hitungPajak(kegiatan, nominal, termasukPPN, adaNpwp){
  if(termasukPPN===undefined) termasukPPN=true;
  if(adaNpwp===undefined) adaNpwp=true;
  nominal=parseFloat(nominal)||0;
  var ref=_klasifikasiPajak(kegiatan);
  var kenaPPN=ref.ppn>0;

  var dpp=(kenaPPN && termasukPPN) ? Math.round(nominal/1.11) : nominal;

  var tarif=ref.tarifPPh||0;
  if(!adaNpwp && tarif>0) tarif=tarif*2;

  var pph=0;
  if(ref.jenisPPh && tarif>0 && (!ref.minPPh || nominal>=ref.minPPh)) pph=Math.round(tarif*dpp);

  var ppn=0;
  if(kenaPPN && (!ref.minPPN || nominal>=ref.minPPN)) ppn=Math.round(ref.ppn*dpp);

  return {
    ref:ref, label:ref.label, jenisPPh:ref.jenisPPh, mapPPh:ref.mapPPh, kjsPPh:ref.kjsPPh,
    dpp:dpp, tarifPPhPct:+(tarif*100).toFixed(2), pph:pph, ppn:ppn,
    totalPajak:pph+ppn, nettoRekanan:nominal-pph-ppn, catatan:ref.catatan,
    nonNpwp:!adaNpwp, kenaPPN:kenaPPN, nominal:nominal, termasukPPN:termasukPPN
  };
}

function fotoCount(t){return fotoJmlMap[String(t.no)]||0;}
function isNotaLunas(t){return t.kredit>0 && t.notaTotal>=t.kredit;}

function statusOf(t){
  var fnJml=fotoCount(t), lunas=isNotaLunas(t);
  if(t.noSpby) return 'spby';
  if(lunas && fnJml>0) return 'lengkap';
  if(lunas && fnJml===0) return 'nota-ok';
  if(fnJml>0) return 'foto-ok';
  return 'belum';
}
function passFilter(t){
  switch(currentFilter){
    case 'all': return true;
    case 'belum': return t.statusSpj!=='Lunas';
    case 'sudah': return t.statusSpj==='Lunas';
    case 'belumlunas': return t.kredit>0 && !isNotaLunas(t);
    case 'belumfoto': return t.kredit>0 && fotoCount(t)===0;
    case 'spby': return !!t.noSpby;
    default: return true;
  }
}

/* ============== Foto: kompresi Canvas (max 1280px, q 0.7) ============== */
function compressImage(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1280,w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}
      else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var dataUrl=cv.toDataURL('image/jpeg',0.7);
      cb({base64:dataUrl,mimeType:'image/jpeg',namaFile:(file.name||'foto')+'.jpg'});
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ============== Format & terbilang ============== */
function _fmtRp(n){return rupiah(n);}
function _tglPanjang(d){
  var bln=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus',
    'September','Oktober','November','Desember'];
  var dt=(d instanceof Date)?d:new Date(d);
  if(isNaN(dt.getTime())) return String(d||'');
  return dt.getDate()+' '+bln[dt.getMonth()]+' '+dt.getFullYear();
}
function _terbilang(n){
  n=Math.floor(Math.abs(parseFloat(n)||0));
  var satuan=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan',
    'sepuluh','sebelas'];
  function konv(x){
    if(x<12) return satuan[x];
    if(x<20) return konv(x-10)+' belas';
    if(x<100) return konv(Math.floor(x/10))+' puluh'+(x%10?' '+konv(x%10):'');
    if(x<200) return 'seratus'+(x-100?' '+konv(x-100):'');
    if(x<1000) return konv(Math.floor(x/100))+' ratus'+(x%100?' '+konv(x%100):'');
    if(x<2000) return 'seribu'+(x-1000?' '+konv(x-1000):'');
    if(x<1000000) return konv(Math.floor(x/1000))+' ribu'+(x%1000?' '+konv(x%1000):'');
    if(x<1000000000) return konv(Math.floor(x/1000000))+' juta'+(x%1000000?' '+konv(x%1000000):'');
    if(x<1000000000000) return konv(Math.floor(x/1000000000))+' miliar'+(x%1000000000?' '+konv(x%1000000000):'');
    return konv(Math.floor(x/1000000000000))+' triliun'+(x%1000000000000?' '+konv(x%1000000000000):'');
  }
  if(n===0) return 'nol rupiah';
  var s=konv(n).replace(/\s+/g,' ').trim();
  return s.charAt(0).toUpperCase()+s.slice(1)+' rupiah';
}
function _terbilangTitle(n){ // Title Case: "Dua Juta Lima Ratus Ribu Rupiah"
  return _terbilang(n).replace(/\S+/g,function(w){return w.charAt(0).toUpperCase()+w.slice(1);});
}
function _rp0(n){ return 'Rp'+(Math.round(parseFloat(n)||0)).toLocaleString('id-ID'); }
function _angka2(n){ return (parseFloat(n)||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function _romawi(m){ return ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][m]||''; }

    alamat:document.getElementById('pvAlamat').value.trim() };
  _sspCache[_sspTarget]=data;
  _allPenyedia=null; // refresh cache lain kali
  google.script.run.serverSimpanPenyedia(data); // simpan async, tak menunggu
  closeModal('modalPenyedia');
  if(_sspLanjut) _sspLanjut(data);
}

/* ============== Kalkulator Pajak ============== */
function openModalPajak(noTransaksi){
  var t=_cariTransaksi(noTransaksi);
  if(!t){ toast('Transaksi tidak ditemukan','error'); return; }
  _sspTarget=noTransaksi;
  document.getElementById('pjTxLabel').textContent='No '+t.no;
  document.getElementById('pjNominal').textContent='Nilai transaksi: '+rupiah(t.kredit);
  document.getElementById('pjTermasukPPN').checked=true;
  document.getElementById('pjAdaNpwp').checked=true;
  recalcPajak();
  openModal('modalPajak');
}
function recalcPajak(){
  var t=_cariTransaksi(_sspTarget); if(!t) return;
  var pj=hitungPajak(t.kegiatan, t.kredit,
    document.getElementById('pjTermasukPPN').checked,
    document.getElementById('pjAdaNpwp').checked);
  document.getElementById('pjKategori').textContent=pj.label+(pj.jenisPPh?(' — '+pj.jenisPPh):'');
  var npwpNote=pj.nonNpwp?' <span class="chip no">non-NPWP x2</span>':'';
  document.getElementById('pjRincian').innerHTML=''
    +baris('DPP', rupiah(pj.dpp)+(pj.kenaPPN&&pj.termasukPPN?' (÷ 1,11)':''))
    +baris('PPh'+(pj.tarifPPhPct?(' ('+pj.tarifPPhPct+'%)'):''), rupiah(pj.pph)+npwpNote)
    +baris('PPN'+(pj.kenaPPN?' (11%)':''), rupiah(pj.ppn))
    +'<hr style="margin:6px 0">'
    +baris('<b>Total potongan</b>', '<b>'+rupiah(pj.totalPajak)+'</b>')
    +baris('Dibayar ke rekanan', rupiah(pj.nettoRekanan))
    +(pj.jenisPPh?baris('MAP / KJS', pj.mapPPh+' / '+pj.kjsPPh):'')
    +(pj.catatan?'<div class="tgl" style="margin-top:6px">'+esc(pj.catatan)+'</div>':'');
  function baris(l,v){return '<div class="row1" style="margin:3px 0"><span class="tgl">'+l+'</span><span>'+v+'</span></div>';}
}

/* ============== SSP (dasar) ============== */
function cetakSSP(jenis){
  var t=_cariTransaksi(_sspTarget); if(!t) return;
  var pj=hitungPajak(t.kegiatan, t.kredit,
    document.getElementById('pjTermasukPPN').checked,
    document.getElementById('pjAdaNpwp').checked);
  if(jenis==='pph' && !pj.pph){ toast('Tidak ada PPh untuk transaksi ini','info'); return; }
  if(jenis==='ppn' && !pj.ppn){ toast('Tidak ada PPN untuk transaksi ini','info'); return; }
  butuhPenyedia(_sspTarget, 'ssp', function(penyedia){
    _bukaPopup(_renderSspHtml(t, pj, penyedia, jenis));
  });
}

  return ''
  +'<html><head><meta charset="utf-8"><title>'+judul+' KT-'+t.no+'</title><style>'

/* ============== Util popup ============== */
function _cariTransaksi(no){
  for(var i=0;i<allTransaksi.length;i++){ if(String(allTransaksi[i].no)===String(no)) return allTransaksi[i]; }
  return null;
}
function _bukaPopup(html){
  var w=window.open('','_blank');
  if(!w){ toast('Popup diblokir browser. Izinkan popup lalu coba lagi.','error'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ============== Init ============== */
(function init(){
  document.getElementById('userLabel').textContent=CURRENT_USER||'tamu';
  var btns=document.querySelectorAll('#filterBar button');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click',function(){
      currentFilter=this.getAttribute('data-f');
      for(var j=0;j<btns.length;j++)btns[j].classList.remove('active');
      this.classList.add('active');
      // Filter status hanya relevan untuk transaksi keluar
      if(currentArah==='masuk') setArah('keluar');
      renderList();
    });
  }
  var abtns=document.querySelectorAll('#arahBar button');
  for(var k=0;k<abtns.length;k++){
    abtns[k].addEventListener('click',function(){ setArah(this.getAttribute('data-a')); renderList(); });
  }
  loadAll();
})();
</script>
